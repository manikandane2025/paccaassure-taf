# pre-commit: `uv run python -m pre_commit install` once per clone.
#
# Every hook is `repo: local` and runs through the project's locked environment
# (`uv run --frozen python -m ...`), so hook versions equal uv.lock and CI (ADR-0014).
# Deliberately NO remote Python hook repos: pre-commit would build its own virtualenvs
# with console-script .exe launchers under the user profile, which endpoint security on
# managed Windows machines blocks ("Access is denied"). `python -m` is never blocked.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: local
    hooks:
      # ---- file hygiene (pre-commit-hooks package, locked in uv.lock)
      - id: check-yaml
        name: check yaml
        entry: uv run --frozen python -m pre_commit_hooks.check_yaml --allow-multiple-documents
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: uv run --frozen python -m pre_commit_hooks.check_toml
        language: system
        types: [toml]
      - id: check-json
        name: check json
        entry: uv run --frozen python -m pre_commit_hooks.check_json
        language: system
        types: [json]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen python -m pre_commit_hooks.trailing_whitespace_fixer --markdown-linebreak-ext=md
        language: system
        types: [text]
      - id: mixed-line-ending
        name: mixed line endings (report only; .gitattributes owns endings)
        entry: uv run --frozen python -m pre_commit_hooks.mixed_line_ending --fix=no
        language: system
        types: [text]
      - id: check-merge-conflict
        name: merge conflict markers
        entry: uv run --frozen python -m pre_commit_hooks.check_merge_conflict
        language: system
        types: [text]
      - id: check-case-conflict
        name: case conflicts (Windows/macOS are case-insensitive)
        entry: uv run --frozen python -m pre_commit_hooks.check_case_conflict
        language: system
      - id: check-added-large-files
        name: large files (>512 KB)
        entry: uv run --frozen python -m pre_commit_hooks.check_added_large_files --maxkb=512
        language: system
      - id: detect-private-key
        name: private keys
        entry: uv run --frozen python -m pre_commit_hooks.detect_private_key
        language: system
        types: [text]

      # ---- secrets (gitleaks in its pinned Docker image; fails open locally if Docker is down,
      #      CI runs the full-history scan fail-closed via `dev.py secrets`)
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: uv run --frozen python scripts/dev.py secrets-staged
        language: system
        pass_filenames: false

      # ---- Python quality
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen python scripts/dev.py typecheck
        language: system
        types_or: [python, pyi, toml]
        pass_filenames: false
      - id: import-linter
        name: import-linter contracts
        entry: uv run --frozen python scripts/dev.py imports
        language: system
        types_or: [python, toml]
        pass_filenames: false
      - id: license-policy
        name: license allow-list (when dependencies change)
        entry: uv run --frozen python scripts/dev.py licenses
        language: system
        files: ^(pyproject\.toml|uv\.lock|scripts/license_policy\.toml|scripts/check_licenses\.py)$
        pass_filenames: false
